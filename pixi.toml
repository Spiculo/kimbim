[workspace]
name = "kimcad"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = "3.12.*"
ifcopenshell = "0.9.0.*"
# OCCT without VTK: the "all" build pulls Mesa (opengl32.dll) into the env, forcing software rendering on Windows (spike S2)
occt = { version = "8.0.1.*", build = "novtk*" }
blake3 = ">=1.0"
numpy = "*"
maturin = ">=1.15,<2"
pytest = ">=8"
rust = ">=1.85"
git = ">=2.45"
pip = "*"
lark = "*"
qt6-main = ">=6.11.2,<7"
cmake = ">=4.4.4,<5"
ninja = ">=1.13.2,<2"
cxx-compiler = ">=2.0.0,<3"
# M3 exit check: web-ifc (independent IFC engine) runs on Node
nodejs = ">=22"

[tasks]
# M3 exit test: build the two-storey sample house through the modeling commands, then check that
# it validates (schema + EXPRESS rules) and that web-ifc opens and meshes every element.
house = "python tools/make_house.py build/house.ifc"
# M4 exit test: the house's sheet A01 (plan, section, elevation, title block) exported to PDF by the app
# (no window) and checked: one A3 page, vector content, fonts; the sheet holds the three drawings.
m4 = { cmd = "python tools/check_m4.py build/house.ifc build/m4", depends-on = ["house", "app-build", "build"] }
interop-install = { cmd = "npm ci --no-audit --no-fund", cwd = "tools/interop" }
interop = { cmd = "python tools/check_interop.py build/house.ifc", depends-on = ["interop-install", "house"] }
build = "maturin develop --release --skip-install"
check-spdx = "python tools/check_spdx.py"
test-rust = "cargo test --workspace"
test-py = { cmd = "pytest", depends-on = ["build"] }
test = { depends-on = ["check-spdx", "test-rust", "test-py"] }
fetch-corpus = "python tests/corpus/fetch.py"
golden = { cmd = "pytest -m \"golden and not slow\"", depends-on = ["build"] }
golden-all = { cmd = "pytest -m golden", depends-on = ["build"] }
app-configure = "cmake -S . -B build/app -G Ninja -DCMAKE_BUILD_TYPE=Release"
app-build = { cmd = "cmake --build build/app", depends-on = ["app-configure"] }
app-test = { cmd = "ctest --test-dir build/app --output-on-failure", depends-on = ["app-build", "build"], env = { KIMCAD_PYTHON_PATH = "$PIXI_PROJECT_ROOT/python" } }
app-test-nogui = { cmd = "ctest --test-dir build/app --output-on-failure -LE gui", depends-on = ["app-build", "build"], env = { KIMCAD_PYTHON_PATH = "$PIXI_PROJECT_ROOT/python" } }
app = { cmd = "build/app/kimcad-app", depends-on = ["app-build", "build"], env = { KIMCAD_PYTHON_PATH = "$PIXI_PROJECT_ROOT/python" } }
# Spike S6: SVG drawing generation (plan, section, elevation) timed on the large Clinic model
drawing-bench = "python spikes/s6_drawings/drawing_bench.py Clinic_Architectural.ifc build/s6-clinic"
check-translations = "python tools/check_translations.py"
kimcad = { cmd = "python -m kimcad", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/python" } }

# Spike S2 (viewer): OCCT AIS viewer through pythonocc-core, same OCCT (8.0.1) as ifcopenshell 0.9
[feature.s2.dependencies]
pythonocc-core = { version = "8.0.1.*", build = "novtk*" }
pyside6 = "*"
psutil = "*"

[environments]
s2 = { features = ["s2"], solve-group = "default" }
