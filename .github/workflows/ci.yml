# SPDX-License-Identifier: GPL-3.0-or-later
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - name: SPDX, Rust and Python tests
        run: pixi run test
      - uses: actions/cache@v6
        with:
          path: tests/corpus/files
          key: corpus-v1-${{ hashFiles('tests/corpus/fetch.py') }}
      - name: Fetch IFC corpus
        run: pixi run fetch-corpus
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Golden hashes and Slice 1 exit test (same results on Windows and Linux)
        run: pixi run golden
      - name: Desktop app - translations complete (English + Spanish)
        run: pixi run check-translations
      - name: M3 exit test - two-storey house validates (schema + EXPRESS rules) and opens in web-ifc
        run: pixi run interop
      # Informational (Slice 14 risk check): drawing generation times on Clinic, read from the log.
      - name: Spike S6 - drawing generation timing on Clinic (informational)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: pixi run drawing-bench
      # On Linux, OCCT connects to an X display as soon as a viewer exists (even without drawing),
      # so the non-GPU app tests also need a virtual display there.
      - name: Desktop app - build and tests that need no GPU (Windows)
        if: runner.os == 'Windows'
        run: pixi run app-test-nogui
      - name: Desktop app - build and tests that need no GPU (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" pixi run app-test-nogui
      # GUI self-tests open a real OpenGL window. Windows runners have no usable OpenGL; on Linux,
      # Xvfb + Mesa (software rendering, fine on CI) works. Non-blocking until proven on the runner.
      - name: Desktop app - GUI self-tests (Linux, virtual display)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run -a -s "-screen 0 1920x1080x24" pixi run ctest --test-dir build/app --output-on-failure -L gui
        env:
          KIMCAD_PYTHON_PATH: ${{ github.workspace }}/python
      - name: M4 exit test - the house's sheet (plan, section, elevation, title block) exported to PDF
        run: pixi run m4
      - name: M5 exit test - two options of the house edited, compared and combined with a conflict resolved
        run: pixi run m5
      - name: Renovation exit test - one sheet per renovation purpose with a legend, the right walls on each
        run: pixi run renovation
      # Informational (Slice 14): the South Elevation of Clinic through the app's own pipeline (visible-element
      # pass + serializer in a child process); read drawing_s and drawing_visible from the log.
      - name: Slice 14 - Clinic elevation in the app (informational)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run -a -s "-screen 0 1920x1080x24" pixi run build/app/app/kimcad-app --self-test "$(find tests/corpus/files -name Clinic_Architectural.ifc | head -1)" --frames 1 --create-drawings --open-drawing "South Elevation"
        env:
          KIMCAD_PYTHON_PATH: ${{ github.workspace }}/python
